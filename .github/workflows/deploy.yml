name: DEPLOY

on:
  push:
    branches: [ trunk ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install build dependencies
        run: |
          sudo apt-get install -y bmake curl

      - name: Build .env
        run: |
          cat <<- EOF >.env
          	WEBSITE_DEST = ${{ secrets.PR_DEPLOY_PATH }}
          	WEBSITE_S3BUCKET = ${{ vars.WEBSITE_S3BUCKET }}
          EOF

      - name: Build .env
        run: |
          cat <<- EOF >.env
          	WEBSITE_S3BUCKET = ${{ vars.WEBSITE_S3BUCKET }}
          	SSH_USER = ${{ vars.DEPLOY_USER }}
          	SSH_HOST = ${{ vars.DEPLOY_HOST }}
          	WEBSITE_DEST = ${{ vars.DEPLOY_PATH }}
          EOF

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ vars.DEPLOY_PORT }} -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          cat <<- EOF >> ~/.ssh/config
          	Host ${{ vars.DEPLOY_HOST }}
          		HostName ${{ vars.DEPLOY_HOST }}
          		Port ${{ vars.DEPLOY_PORT }}
          		User ${{ vars.DEPLOY_USER }}
          		IdentityFile ~/.ssh/deploy_key
          		StrictHostKeyChecking no
          EOF

      - name: Build and deploy
        run: |
          bmake build
          bmake sync
